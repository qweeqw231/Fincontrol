# ============================================
# FinControl 后端主配置（Phase 1a.5+，1a.8 重构）
# ============================================
# 适用场景：所有 profile 共用此文件
# 覆盖规则：application-{profile}.yml > application.yml
# 本地覆盖：application-local.yml（gitignore 内，仅本机使用，含真实视觉模型 key）
# 详见：docs/SETUP.md §2.2 / docs/phase-1/subphase-plan.md 子阶段 1a.1
# ============================================

spring:
  application:
    name: fincontrol-backend

  profiles:
    # 默认激活 local profile；CI/容器环境通过环境变量 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ============================
  # 数据源 + 连接池（HikariCP）
  # ============================
  # 1a.2 验收：HikariCP pool size = 10
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fincontrol}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: FinControlHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
    dbcp2:
      enabled: false

  # ============================
  # 文件上传（截图解析使用）
  # ============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2MB

  # ============================
  # Jackson 时区
  # ============================
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# ============================================
# MyBatis-Plus（Phase 1a.1 启用）
# ============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fincontrol.entity
  # 1a.3.5 双方言支持（[docs/phase-1/designs/1a3-dedup-strategy.md §10](#)）
  # 重要：MyBatis-Plus 限制 configuration 与 config-location 互斥。
  # 所有 MyBatis 配置（settings + DatabaseIdProvider）统一在 mybatis-config.xml。
  # MyBatis-Plus 专有配置（id-type=auto 等）已移到 Entity 的 @TableId 注解。
  config-location: classpath:mybatis-config.xml

# ============================================
# springdoc-openapi（Swagger UI）
# ============================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ============================================
# Spring Boot Actuator（1a.1 验收：/actuator/health）
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

# ============================================
# FinControl 应用配置（统一 fincontrol. 顶层，1a.8 重构）
# ============================================
fincontrol:
  default-user-id: 1

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  upload:
    screenshot:
      path: ${UPLOAD_SCREENSHOT_PATH:./uploads/screenshots/}
      max-size-mb: 20

  # 1a.8 v3：真实 OCR 审计日志。相对路径由 ScreenshotService 解析到仓库根；
  # 部署时可用绝对 FINCONTROL_OCR_LOG_PATH 覆盖。
  ocr:
    log-path: ${FINCONTROL_OCR_LOG_PATH:docs/test-records/ocr-results}

  # 1a.10：top 与去重后唯一基金加和的偏差阈值。0.01 表示 1%。
  dedup:
    discrepancy-threshold-pct: ${FINCONTROL_DEDUP_DISCREPANCY_THRESHOLD_PCT:0.01}

  # 视觉模型配置（Phase 1a.5+，1a.8 保留兼容段 + 新增 fincontrol.ai.vision）
  # ============================================
  # 1a.8 兼容性说明：
  #   - fincontrol.vision.* 段：1a.5-1a.7 VisionModelClient @Value 注入使用
  #   - fincontrol.ai.* 段：1a.8 起 AiProperties @ConfigurationProperties 注入使用
  #   - 两段当前并存；Commit B 重构 VisionModelClient 后 fincontrol.vision.* 段可弃用
  # ============================================
  vision:
    base-url: https://api.minimaxi.com/v1
    model: MiniMax-M3
    timeout-seconds: 300
    api-key: ${VISION_API_KEY:REPLACE_ME_VISION_API_KEY}

  # ============================================
  # AI 客户端配置（1a.8 统一根段 fincontrol.ai.*）
  # ============================================
  # API Key 加载优先级（任意 provider 都适用）：
  #   1. 环境变量（VISION_API_KEY / DOUBAO_VISION_API_KEY / TEXT_AI_API_KEY / DEEPSEEK_CHAT_API_KEY）
  #   2. application-local.yml（gitignored，本机覆盖）
  #   3. REPLACE_ME_*_KEY 占位符（首调抛 5001/5002）
  ai:
    # 文本 AI primary（minimax M3，1a.6 沿用）
    text:
      base-url: https://api.minimaxi.com/v1
      model: MiniMax-Text-01
      temperature: 0.7
      max-tokens: 1024
      timeout-seconds: 60
      api-key: ${TEXT_AI_API_KEY:REPLACE_ME_TEXT_AI_KEY}

      # 1a.8：文本端 DeepSeek V3 fallback（OpenAI 兼容，零代码改动，仅切 baseUrl/apiKey/model）
      # Commit C（1a.8.5）TextAiClient 切 provider 入口时启用
      fallback:
        base-url: https://api.deepseek.com/v1
        model: deepseek-chat
        temperature: 0.7
        max-tokens: 1024
        timeout-seconds: 60
        api-key: ${DEEPSEEK_CHAT_API_KEY:REPLACE_ME_DEEPSEEK_CHAT_API_KEY}

    # 1a.8 视觉模型双 provider 配置
    # 1-2 张图：minimax primary（OpenAI chat completions）；3+ 张图：豆包 primary（OpenAI Responses API）
    # 互为 fallback：minimax 失败 → 豆包；豆包失败 → minimax
    vision:
      minimax:
        base-url: https://api.minimaxi.com/v1
        model: MiniMax-M3
        timeout-seconds: 300
        api-key: ${VISION_API_KEY:REPLACE_ME_VISION_API_KEY}
      doubao:
        # 豆包 ARK / OpenAI Responses 端点
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-seed-1-8-251228
        timeout-seconds: 300
        api-key: ${DOUBAO_VISION_API_KEY:REPLACE_ME_DOUBAO_VISION_API_KEY}

    # 1a.8 AiRouter 策略（imageCount 阈值 + cache + retry/CB）
    # 默认与 work plan §Gate 0 决策一致；可按场景调整
    router:
      image-count-threshold: 2
      cache-max-size: 1024
      cache-ttl-hours: 24
      vision-retry-attempts: 2
      vision-circuit-breaker-sliding-window: 10
      vision-circuit-breaker-failure-rate: 50.0

# ============================================
# 服务端口
# ============================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
