# ============================================
# FinControl Backend Application Configuration
# ============================================
# 配套文档：docs/phase-0/decisions.md
# 用户决策：
#   - MySQL localhost:3306, HikariCP 池大小10
#   - X-User-Id: Interceptor + @RequestHeader 默认1
#   - 截图存储: ./uploads/screenshots/
#   - Swagger: 启用（springdoc-openapi）
#   - 时区: UTC+8 (Asia/Shanghai)
#   - BigDecimal: 2位小数 + 字符串传输
#   - DeepSeek 模型: deepseek-v4-flash（2026-07-24 后 deepseek-chat 弃用）
# ============================================

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fincontrol-backend
  datasource:
    url: jdbc:mysql://localhost:3306/fincontrol?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    # BigDecimal 转字符串，避免前端精度丢失
    big-decimal-as-string: true
    # 时间格式与时区
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # Spring Boot 3.x 移除了 write-bigs-as-strings（如需 Long 转字符串，
    # 需在实体字段上添加 @JsonFormat(shape = JsonFormat.Shape.STRING)）
    serialization:
      write-dates-as-timestamps: false  # 日期序列化为字符串而非时间戳

# DeepSeek API 配置（决策：C - OkHttp）
# 模型说明：
#   - deepseek-v4-flash（当前推荐，新模型，2026-07-24 后 deepseek-chat 弃用）
#   - deepseek-v4-pro（高规格模型）
deepseek:
  api-key: ${sk-d2678b8a8ef145d0ab235dced7cfe93c}
  base-url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  timeout-seconds: 30
  max-retries: 2

# 文件上传配置
upload:
  screenshot:
    path: ./uploads/screenshots/
    max-size: 10MB
    allowed-types: jpg,jpeg,png,webp

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc-openapi（Swagger UI）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.fincontrol.controller

# 日志配置（决策：Logback 默认）
logging:
  level:
    root: INFO
    com.fincontrol: DEBUG
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"