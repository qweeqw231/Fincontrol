# ============================================
# FinControl 后端主配置（Phase 1a.5+）
# ============================================
# 适用场景：所有 profile 共用此文件
# 覆盖规则：application-{profile}.yml > application.yml
# 本地覆盖：application-local.yml（gitignore 内，仅本机使用，含真实视觉模型 key）
# 详见：docs/SETUP.md §2.2 / docs/phase-1/subphase-plan.md 子阶段 1a.1
# ============================================

spring:
  application:
    name: fincontrol-backend

  profiles:
    # 默认激活 local profile；CI/容器环境通过环境变量 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ============================
  # 数据源 + 连接池（HikariCP）
  # ============================
  # 1a.2 验收：HikariCP pool size = 10
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fincontrol}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: FinControlHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
    dbcp2:
      enabled: false

  # ============================
  # 文件上传（截图解析使用）
  # ============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2MB

  # ============================
  # Jackson 时区
  # ============================
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# ============================================
# MyBatis-Plus（Phase 1a.1 启用）
# ============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fincontrol.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: NULL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================
# springdoc-openapi（Swagger UI）
# ============================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.fincontrol.controller
  default-produces-media-type: application/json

# ============================================
# Spring Boot Actuator（1a.1 验收：/actuator/health）
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

# ============================================
# 视觉模型配置（Phase 1a.5 替代旧 DeepSeek 配置）
# ============================================
fincontrol:
  default-user-id: 1

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  upload:
    screenshot:
      path: ${UPLOAD_SCREENSHOT_PATH:./uploads/screenshots/}
      max-size-mb: 20

  # 视觉模型（minimax M3 系列，原生多模态图像 + 视频）
  # API Key 加载优先级：
  #   1. 环境变量 VISION_API_KEY
  #   2. application-local.yml 中的 fincontrol.vision.api-key
  #   3. 本占位符（REPLACE_ME_VISION_API_KEY，启动时会抛 5001 强制填）
  vision:
    base-url: https://api.minimaxi.chat/v1
    model: MiniMax-M3-512k
    timeout-seconds: 60
    api-key: ${VISION_API_KEY:sk-cp-bB6UnjYhydbde0bxgE4EP7iigWKDaXaZb6UX4sa_kLHwOUZgpVrF1G4GPKsg_HwYT4c0Lrsiut2eUqRi1Wo3bVBw3oqOilC0WiNLuXv-sx9cFmCKtRaLxR4}

# ============================================
# 服务端口
# ============================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
